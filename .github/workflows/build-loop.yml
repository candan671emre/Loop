name: Build Loop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app

    - name: Build Loop App
      run: |
        xcodebuild -workspace Loop.xcworkspace -scheme Loop -configuration Release -derivedDataPath build

    - name: Package IPA
      run: |
        mkdir Payload
        cp -r build/Build/Products/Release-iphoneos/Loop.app Payload/
        zip -r Loop.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Loop
        path: Loop.ipa
